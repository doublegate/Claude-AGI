global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'claude-agi-monitor'

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Claude-AGI Application Metrics
  - job_name: 'claude-agi-app'
    static_configs:
      - targets: ['claude-agi:8001']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 5s

  # System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Grafana Metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Health Check Endpoints
  - job_name: 'claude-agi-health'
    static_configs:
      - targets: ['claude-agi:8000']
    scrape_interval: 10s
    metrics_path: '/health'
    scheme: 'http'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093