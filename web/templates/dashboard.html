<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude-AGI Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-name {
            font-weight: 500;
            color: #666;
        }

        .metric-value {
            font-weight: 700;
            font-size: 1.1em;
            color: #667eea;
        }

        .phase {
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #10b981;
        }

        .phase h3 {
            font-size: 1em;
            margin-bottom: 8px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.3s ease;
        }

        .feature {
            padding: 10px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feature-name {
            font-weight: 500;
        }

        .feature-badge {
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-box {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .performance-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .perf-value {
            font-weight: 700;
            color: #10b981;
        }

        .perf-target {
            font-size: 0.9em;
            color: #999;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Claude-AGI System Dashboard</h1>
            <p style="margin: 10px 0; color: #666;">Advanced General Intelligence - Production Monitoring</p>
            <span class="status-badge">
                <span class="live-indicator"></span>
                FULLY OPERATIONAL
            </span>
            <span class="status-badge" style="background: #667eea; margin-left: 10px;">
                100% COMPLETE
            </span>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📊 System Statistics</h2>
                <div id="stats-container"></div>
            </div>

            <div class="card">
                <h2>📈 Phase Completion</h2>
                <div id="phases-container"></div>
            </div>

            <div class="card">
                <h2>⚡ Performance Metrics</h2>
                <div id="performance-container"></div>
            </div>
        </div>

        <div class="card">
            <h2>🎯 Operational Features</h2>
            <div id="features-container" class="grid"></div>
        </div>
    </div>

    <script>
        // Fetch and display stats
        async function loadStats() {
            const response = await fetch('/api/stats');
            const data = await response.json();

            const html = `
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-number">${data.code_lines.toLocaleString()}</div>
                        <div class="stat-label">Lines of Code</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.test_coverage}%</div>
                        <div class="stat-label">Test Coverage</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.tests_passing}/${data.tests_total}</div>
                        <div class="stat-label">Tests Passing</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.modules}</div>
                        <div class="stat-label">Modules</div>
                    </div>
                </div>
            `;

            document.getElementById('stats-container').innerHTML = html;
        }

        // Fetch and display phases
        async function loadPhases() {
            const response = await fetch('/api/phases');
            const data = await response.json();

            const html = data.phases.map(phase => `
                <div class="phase">
                    <h3>Phase ${phase.id}: ${phase.name}</h3>
                    <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                        Tests: ${phase.tests.passing}/${phase.tests.total} passing
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${phase.completion}%"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('phases-container').innerHTML = html;
        }

        // Fetch and display performance
        async function loadPerformance() {
            const response = await fetch('/api/performance');
            const data = await response.json();

            const html = data.metrics.slice(0, 5).map(metric => `
                <div class="performance-item">
                    <div>
                        <div>${metric.name}</div>
                        <div class="perf-target">Target: ${metric.target.toLocaleString()} ${metric.unit}</div>
                    </div>
                    <div class="perf-value">${metric.value.toLocaleString()}</div>
                </div>
            `).join('');

            document.getElementById('performance-container').innerHTML = html;
        }

        // Fetch and display features
        async function loadFeatures() {
            const response = await fetch('/api/features');
            const data = await response.json();

            const categories = {};
            data.features.forEach(feature => {
                if (!categories[feature.category]) {
                    categories[feature.category] = [];
                }
                categories[feature.category].push(feature);
            });

            const html = Object.entries(categories).map(([category, features]) => `
                <div class="card">
                    <h2>${category}</h2>
                    ${features.map(f => `
                        <div class="feature">
                            <span class="feature-name">${f.name}</span>
                            <span class="feature-badge">ACTIVE</span>
                        </div>
                    `).join('')}
                </div>
            `).join('');

            document.getElementById('features-container').innerHTML = html;
        }

        // Load all data
        loadStats();
        loadPhases();
        loadPerformance();
        loadFeatures();

        // Refresh every 5 seconds
        setInterval(() => {
            loadStats();
            loadPerformance();
        }, 5000);
    </script>
</body>
</html>
